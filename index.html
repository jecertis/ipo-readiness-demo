<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readiness prototype</title>
<style>
/* Neutral slate palette for the public demonstration. */
:root{
  --brand:#33475b; --brand-soft:#e3e9ef; --brand-ink:#ffffff; --pink:#2f6fb0; --header-bg:#33475b; --header-ink:#ffffff;
  --ink:#282828; --muted:#6e6e6e; --line:#e2e2e2; --bg:#f1f4f7; --surface:#ffffff;
  --ok:#0a7a4f; --ok-soft:#ebf9f8; --warn:#8a5a00; --warn-soft:#fff3d6; --bad:#b0103f; --bad-soft:#fde6ef;
  --side-bg:#ffffff; --side-ink:#282828;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* Dark palette: the header keeps the brand colour; accents are lifted so text on dark stays readable. */
:root[data-theme="dark"]{
  --brand:#8fb3d9; --brand-soft:#1f2a36; --brand-ink:#0f1720; --pink:#8fb3d9; --header-bg:#33475b; --header-ink:#ffffff;
  --ink:#e8ecf0; --muted:#a7b0bb; --line:#303741; --bg:#14171c; --surface:#1d2229;
  --ok:#5fcf8c; --ok-soft:#173a27; --warn:#f0b443; --warn-soft:#3d2d0a; --bad:#ff8a80; --bad-soft:#40201d;
  --side-bg:#1d2229; --side-ink:#e8ecf0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.bar{position:sticky;top:0;z-index:40;background:var(--header-bg);color:var(--header-ink);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 32px;min-height:92px}
.util{display:flex;gap:6px;flex-wrap:nowrap;margin-left:auto}
.util:not(.float){padding-left:12px;border-left:1px solid rgba(255,255,255,.35)}
.vb{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:transparent;color:var(--header-ink);border:1px solid rgba(255,255,255,.55)}
.vb:hover{background:rgba(255,255,255,.22)}
.vb[aria-pressed="true"]{background:rgba(255,255,255,.22)}
.vb:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.util.float .vb{background:var(--surface);color:var(--brand);border-color:var(--line)}
.util.float{position:fixed;top:10px;right:12px;z-index:60}
body.hdr-hidden .ctl{display:none}
body.hdr-hidden .crumbs{display:none}
body.hdr-hidden .bar{padding:4px 20px;min-height:0}
body.hdr-hidden .side .brand{min-height:0}
body.hdr-hidden .logo{height:22px}
body.hdr-hidden .pname{font-size:14px}
.brand{display:flex;align-items:center;gap:12px;min-height:38px}
.logo{height:34px;width:auto;display:block}
.logoslot{display:inline-grid;place-items:center;min-width:90px;height:30px;padding:0 8px;border:1px dashed rgba(255,255,255,.6);border-radius:6px;font-size:12px}
.pname{font-weight:700;font-size:16px;letter-spacing:.02em}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-left:auto;font-size:14px}
.ctl label{opacity:.85}
.ctl select{background:var(--surface);color:var(--ink);border:0;border-radius:6px;padding:5px 8px;max-width:230px}
.hb{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 10px}
.hb:hover{background:rgba(255,255,255,.25)}
.crumbs{width:100%;font-size:14px;opacity:.9}
.wrap{max-width:1080px;margin:0 auto;padding:24px 32px 96px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.steps li{flex:1 1 150px}
.step{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--muted)}
.step b{display:block;font-size:12px;font-weight:700}
.step.done{border-bottom-color:var(--ok);color:var(--ok)}
.step.current{border-bottom-color:var(--brand);color:var(--ink);font-weight:600}
.step.attn::after{content:" ●";color:var(--pink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
.card+.card,.card+section,section+.card{margin-top:24px}
.card.attn{border-left:5px solid var(--pink)}
.card h2,.card h3{margin:0 0 8px}
h1{font-size:28px;line-height:1.2;margin:0 0 8px}
h2{font-size:20px}
h3{font-size:16px}
.sub{color:var(--muted);margin:0}
p{max-width:72ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 16px;font-weight:600}
.btn.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:var(--brand-soft)}to{background:transparent}}
.btn.lnk{border:0;background:transparent;color:var(--brand);padding:4px 0}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.next{background:var(--brand-soft);border:1px solid var(--line);border-radius:10px;padding:20px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.next .eyebrow{font-size:14px;color:var(--brand);font-weight:700}
.next h2{margin:2px 0 4px}
.next p{margin:0}
.next .sub{color:var(--ink)}
.next .chip.plain{color:var(--ink);border-color:var(--ink)}
.next details{margin-top:8px;font-size:14px}
.flash{background:var(--warn-soft);border:1px solid var(--line);color:var(--warn);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.grid>.card{margin-top:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.path{display:flex;gap:0;overflow-x:auto;padding:4px 0 8px}
.node{flex:1 0 118px;position:relative;padding-top:24px;font-size:12px;color:var(--muted);padding-right:8px}
.node::before{content:"";position:absolute;top:7px;left:0;right:0;height:3px;background:var(--line)}
.node::after{content:"";position:absolute;top:1px;left:0;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.node.d::before{background:var(--ok)}.node.d::after{border-color:var(--ok);background:var(--ok)}
.node.n::after{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}
.node.n{color:var(--ink);font-weight:600}
.node b{display:block;font-size:12px;font-weight:700}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.num{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tblw{overflow-x:auto}
.cite{font-family:var(--font);font-size:12px;color:var(--muted)}
.quote{font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.hl{background:var(--warn-soft);outline:2px solid #e3b341;border-radius:6px;padding:0 3px}
.focus{display:grid;gap:12px;grid-template-columns:minmax(220px,1fr) minmax(0,1.5fr)}
@media(max-width:760px){.focus{grid-template-columns:1fr}}
.fact{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.fact.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.big{font-size:28px;font-weight:700;line-height:1.1}
.field{display:block;margin-top:16px;max-width:480px}.field span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.modal .field{max-width:none}
input[type=text],input[type=number],input:not([type]),select.f{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.inline{display:inline-block;width:110px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;z-index:50}
.dh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.db{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;font-size:14px}
.df{padding:10px 14px;border-top:1px solid var(--line)}
.bub{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.center{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.splash{background:var(--header-bg);color:#fff}
.splash .logo{height:56px;margin:0 auto 16px}
.splash .btn{color:var(--header-bg);background:#fff;border-color:#fff}
.loadbar{height:6px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;width:220px;margin:18px auto}
.loadbar i{display:block;height:100%;width:70%;background:#fff}
.login{max-width:380px;width:100%;text-align:left}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:18px 20px}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#33475b;padding:8px 12px;z-index:100;border-radius:0 0 10px 0}
.skip:focus{left:0}
html{scroll-padding-top:120px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* E12 layout: sidebar, top bar actions, menus, accordions, steps carousel */
.side{position:fixed;left:0;top:0;bottom:0;width:224px;background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--line);overflow:auto;padding:0 12px 16px;z-index:45}
.side .brand{margin:0 -12px 8px;padding:12px;min-height:92px;background:var(--header-bg);color:var(--header-ink);flex-wrap:wrap;gap:8px}
.side .logo{height:26px}
.side .pname{font-size:16px}
.side .sg{margin-top:16px}
.sgl{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:700}
.side select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.sbtn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:transparent;color:var(--side-ink);border:0;border-left:3px solid transparent;border-radius:6px;padding:8px 12px;margin:2px 0;font-weight:600;font-size:14px}
.sbtn:hover{background:var(--bg)}
.sbtn.cur{background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand)}
body.has-side .bar,body.has-side .wrap,body.has-side .foot{margin-left:224px}
body.side-rail .side{width:64px;padding:0 8px 16px}
body.side-rail.has-side .bar,body.side-rail.has-side .wrap,body.side-rail.has-side .foot{margin-left:64px}
.sidetog{margin-left:auto;background:rgba(255,255,255,.14);color:var(--header-ink);border:1px solid rgba(255,255,255,.4);border-radius:6px;width:28px;height:28px;font-size:20px;line-height:1;padding:0}
.sidetog:hover{background:rgba(255,255,255,.28)}
.side.is-rail .brand{flex-direction:column;align-items:center;margin:0 -8px 8px}
.side.is-rail .logo{width:36px;height:24px;object-fit:cover;object-position:left center}
.side.is-rail .sidetog{margin:8px 0 0;width:36px}
.sbtn.rail{justify-content:center;position:relative;padding:9px 0;border-left:0}
.dotb{position:absolute;top:6px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
@media(max-width:900px){.side{position:static;width:auto;max-height:none}body.has-side .bar,body.has-side .wrap,body.has-side .foot{margin-left:0}}
.actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.bar .vb{background:transparent;color:var(--header-ink);border:1px solid rgba(255,255,255,.55);list-style:none}
.acct{position:relative}
.acct summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;z-index:80}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:6px;padding:8px 10px;font-weight:600;font-size:14px}
.mi:hover{background:var(--brand-soft)}
.menu{position:relative;display:inline-block}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{right:auto;left:0}
.acc{margin-top:24px}
.pagehead{margin-bottom:24px}.pagehead h1{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.ref{margin-top:48px}.ref h2{margin:0 0 16px}
.acch{margin:0;font-size:16px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.accb{background:transparent;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-align:left}
.accs{font-weight:400;font-size:14px}
.car{display:inline-block;width:1em;color:var(--brand)}
.steps-car{margin:0 0 24px;padding:8px 0 12px;border-bottom:1px solid var(--line)}
.steps-car.open .sc-card{margin-top:8px}
.sc-h{margin:0;font-size:16px}
.sc-card h3{margin:4px 0}
.dots{display:inline-flex;gap:6px;margin-left:8px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--brand);background:transparent;padding:0}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.cur{box-shadow:0 0 0 3px var(--brand-soft);border-color:var(--brand)}
.helpd{right:0}
.who{margin-top:14px;font-size:12px}
.modnav{display:flex;flex-wrap:wrap;gap:4px;width:100%;border-top:1px solid rgba(255,255,255,.25);padding-top:6px;margin-top:2px}
.mtab{background:transparent;color:var(--header-ink);border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:6px 12px;font-weight:600;font-size:14px}
.mtab:hover{background:rgba(255,255,255,.14)}
.mtab.cur{border-bottom-color:var(--header-ink);background:rgba(255,255,255,.18)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:700;text-align:center}
body.hdr-hidden .modnav{display:none}
.rail{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:12px 0 0;counter-reset:r}
.rail li{counter-increment:r;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--muted)}
.rail li::before{content:counter(r) ". ";font-weight:700;color:var(--brand)}
ul.plain{list-style:none;margin:6px 0;padding:0}ul.plain li{padding:4px 0}
.lab{font-size:12px;font-weight:600}
.trail{margin-top:8px}
.sugrow{background:transparent;border:0;padding:0;text-align:left;color:var(--ink);font:inherit}
.finding{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:8px}
/* E13: suggested changes, the live scan, rings and banners */
.finding.sev-block{border-left:4px solid var(--bad)}.finding.sev-review{border-left:4px solid var(--warn)}.finding.sev-ok{border-left:4px solid var(--ok)}
.finding.st-accepted{border-left-color:var(--ok)}.finding.st-rejected{border-left-color:var(--bad);background:var(--bad-soft)}
.sxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.pane{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane .ph{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--line)}
.pane .pb{padding:12px}
.fix{background:var(--brand-soft);border-radius:6px;padding:8px 12px;margin-top:8px}
.req{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:6px;padding:8px 12px;margin-top:8px}
.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:4px 0}
.ring>div{width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.pbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--ok)}
.scan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px}
.ssec{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.ssec.pending{opacity:.5}.ssec.scanning b{color:var(--brand)}.ssec .r{margin-left:auto}
.omission{background:var(--bad-soft);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:12px 16px;margin-top:8px}
.omission b{color:var(--bad)}
.clear{background:var(--ok-soft);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 16px;margin-top:8px}
.clear b{color:var(--ok)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.zone{border:1px solid var(--line);border-radius:10px;padding:16px}.zone.truth{border-top:3px solid var(--ok)}.zone.rev{border-top:3px solid var(--brand)}
.ta{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70}
.modal{position:fixed;z-index:71;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:88vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
@media print{body.has-modal header,body.has-modal main,body.has-modal aside,body.has-modal .modal-bg,body.has-modal .util,body.has-modal .modal .btn{display:none!important}body.has-modal .modal{position:static;transform:none;box-shadow:none;border:0;width:auto;max-height:none}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:6px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
@media print{.bar,.steps,.next,.drawer,.foot,button,.flash,select,.tabs{display:none !important}body{background:#fff}.wrap{padding:0;max-width:none}.card{border:0}}
pre.report{white-space:pre-wrap;font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px}
</style>
</head>

<script>
(function () {
  'use strict';
  var G = window.Guidance, D = window.Demo, O = G.OUTCOME;
  var KEY = 'readinessDemo.v3';

    else app.flash = !String(note).trim() ? 'Add a note: one is required to reject, dismiss or override.' : 'This decision was not recorded: the item may be locked by an ECM Head override.';
  };
  ACT['dec-reopen'] = function (el) {
    var ok = decDispatch(el.dataset.k, {
      sug: function (s, run, id) { return M.reopenSuggestion(s, app.role, run, id); },
      ver: function (s, id) { return M.reopenChange(s, app.role, id); },
      mat: function (s, rv, fact) { return M.reopenMatch(s, app.role, rv, fact); },
      op: function (s, op, i) { return M.reopenFinding(s, app.role, op, i); }
    });
    said(ok, 'Reopened for the BRLM reviewer.', 'Only the ECM Head reopens an override.');
  };
  ACT['save-changes'] = function () {
    said(M.saveChangesDraft(S(), app.role, app.deal), 'Draft of changes saved. Find it under Saved drafts or My projects.', 'Run the review first, and use a role that may save drafts.');
  };
  ACT['send-app'] = function () { app.flash = 'Not sent: no mail account is connected in this demonstration. Use Copy, a download or Save draft.'; };
  ACT['portfolio-filter-kind'] = function (el) { app.pf = app.pf || { kind: '', status: '' }; app.pf.kind = el.value; };
  ACT['portfolio-filter-status'] = function (el) { app.pf = app.pf || { kind: '', status: '' }; app.pf.status = el.value; };
  ACT['history-toggle'] = function () { app.hist = !app.hist; };
  ACT['report-open'] = function () { app.modal = { kind: 'report' }; };
  ACT['copy-report-review'] = function () { copyText(M.reviewReport(S(), app.deal) || ''); };
  ACT['vault-upload'] = function () {
    var n = $('doc_name'), r = M.fileDocument(S(), app.role, n ? n.value : '');
    said(r, r && ('In the Evidence vault, filed under ' + r.category + '.'), 'Enter a document name. Your role must be allowed to upload documents.');
  };
  ACT['drhp-doc'] = function (el) { app.drhpSkip = app.drhpSkip || {}; app.drhpSkip[el.dataset.name] = !el.checked; };
  ACT['vtab'] = function (el) { app.vtab = el.dataset.t; };
  ACT['link-evidence'] = function (el) {
    var n = $('ev_' + el.dataset.ref.replace(/[^A-Za-z0-9]/g, '_'));
    said(M.linkEvidence(S(), app.role, app.deal, el.dataset.ref, n ? n.value : ''), 'Evidence linked from the Evidence vault.', 'Pick a vault document, and use a role that may save to the register.');
  };

  ACT['draft-open'] = function () { var e = M.counselEmail(S(), app.deal); app.modal = { kind: 'counsel', subject: e.subject, body: e.body }; };
  ACT['draft-edit'] = function (el) {
    var d = M.savedDrafts(S(), app.deal).filter(function (x) { return x.id === el.dataset.id; })[0];
    if (d) app.modal = { kind: 'counsel', subject: d.subject, body: d.body };
  };
  ACT['draft-remove'] = function (el) { said(M.removeDraft(S(), app.role, app.deal, el.dataset.id), 'Draft removed.', 'Your role cannot remove drafts.'); };
  ACT['drafts-toggle'] = function () { app.drafts = !app.drafts; };
  ACT['save-draft-modal'] = function () {
    var m = app.modal, d = M.saveDraft(S(), app.role, app.deal, m && m.subject, m && m.body);
    said(d, 'Draft saved. Find it under Saved drafts.', 'Add a subject and a message, and use a role that may save drafts.');
  };
  function copyText(txt) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); app.flash = 'Copied.'; return; }
    } catch (e) { /* fall through */ }
    app.flash = 'Copy is not available in this browser. Use the download instead.';
  }
  ACT['copy-draft'] = function () { copyText(app.modal ? app.modal.subject + '\n\n' + app.modal.body : ''); };
  ACT['download-draft-doc'] = function () { download(deal().id + '-counsel-draft.doc', M.draftHtml(app.modal), 'application/msword'); };
  ACT['download-draft-txt'] = function () { download(deal().id + '-counsel-draft.txt', M.draftText(app.modal)); };
  ACT['mailbox'] = function () { app.flash = 'No mail service is connected in this demonstration. Use Copy or a download.'; };
  ACT['modal-close'] = function () { app.modal = null; };
  ACT['modal-close-bg'] = function () { app.modal = null; };
  ACT['newreview-open'] = function () { app.modal = { kind: 'newreview' }; };
  ACT['new-review'] = function () {
    var n = $('nr_name'), p = M.newReview(S(), app.role, n ? n.value : '');
    if (p) { app.rv = p.id; app.modal = null; app.flash = 'Review project created.'; } else app.flash = 'Name the project, and use a role that may create reviews.';
  };
  ACT['review-open'] = function (el) { app.rv = el.dataset.id; app.view = 'review'; };
  ACT['add-file'] = function (el) {
    var n = $('zf_' + el.dataset.side);
    said(M.addReviewFile(S(), app.role, el.dataset.id, el.dataset.side, n ? n.value : ''), 'Added from the Evidence vault.',
      'Pick a document from the Evidence vault, and use a role that may work on review projects.');
  };
  ACT['run-project'] = function (el) {
    var r = M.runReviewProject(S(), app.role, el.dataset.id);
    if (r && r.error) { app.flash = r.error; return; }
    said(r, r && ('Review run complete — ' + r.findings.length + ' fields compared, ' + r.findings.filter(function (f) { return f.status === 'Differs'; }).length +
      ' differ. Findings saved to the project.'), 'Your role cannot run a review.');
  };
  ACT['save-project'] = function (el) { said(M.saveReviewProject(S(), app.role, el.dataset.id), 'Project saved — resume any time.', 'Your role cannot save review projects.'); };
  ACT['op-type'] = function (el) { app.opType = el.value; };
  ACT['run-intel'] = function () {
    var od = $('op_doc') ? $('op_doc').value : '';
    var o = M.runIntelligence(S(), app.role, app.opType || M.DOC_TYPES[0].id, undefined, od || undefined);
    if (o) { app.opId = o.id; app.flash = 'Opinion: ' + o.overall + '. A decision-support signal, not verification.'; } else app.flash = 'Your role cannot run the intelligence check.';
  };

  ACT['run-check'] = function () {
    var kind = $('kmp_kind').value, val = $('kmp_val').value, r = M.kmpCheck(S(), app.role, app.deal, kind, val);
    app.kmp = { kind: kind, value: val, result: r || null };
    if (!r) app.flash = 'Enter a value, and use a role that may run checks.';
  };
  ACT['save-register'] = function (el) { said(M.saveToRegister(S(), app.role, app.deal, el.dataset.ref), 'Saved to the register.', 'Your role cannot save to the register.'); };
  ACT['materiality'] = function (el) {
    var n = $('mt_' + el.dataset.ref.replace(/[^A-Za-z0-9]/g, '_'));
    said(M.setMateriality(S(), app.role, app.deal, el.dataset.ref, el.dataset.v, n ? n.value : ''), 'Materiality recorded.',
      'Only the ECM Head decides materiality, and a reason is required.');
  };
  ACT['assign-open'] = function () { app.modal = { kind: 'assign' }; };
  ACT['assign-agent'] = function () {
    var a = M.assignAgent(S(), app.role, app.deal, $('ag_sel').value, $('ag_task').value);
    if (a) { app.modal = null; app.flash = 'Assigned ' + a.name + ' (' + a.field + ').'; } else app.flash = 'Only the ECM Head assigns, and a task is required.';
  };
  ACT['assign-status'] = function (el) {
    var a = M.assignments(S(), app.deal).filter(function (x) { return x.id === el.dataset.id; })[0];
    if (!a) return;
    var order = ['Assigned', 'In progress', 'Done'];
    M.setAssignmentStatus(S(), app.role, a.id, order[(order.indexOf(a.status) + 1) % 3]);
  };
  ACT['houserule-open'] = function () { app.modal = { kind: 'houserule' }; };
  ACT['add-house-rule-modal'] = function () {
    var ok = D.addHouseRule(S(), app.role, { head: $('hr_head').value, text: $('hr_text').value, owner: 'Compliance' });
    if (ok) { app.modal = null; app.flash = 'House rule added to the checklist.'; } else app.flash = 'Enter the rule; only the firm admin adds house rules.';
  };


  function askAndLog(label, key) {
    var a = D.answer(S(), key);
    app.askLog.push({ q: label, a: a });
    D.logQuestion(S(), app.role, label, a);       // recorded separately, so answering never changes the deal itself
  }
  ACT['ask-q'] = function (el) { var q = el.dataset.q, label = (SUGGEST.filter(function (x) { return x[0] === q; })[0] || [0, q])[1]; askAndLog(label, q); };
  ACT['ask-send'] = function () { var v = $('askText') ? $('askText').value.trim() : ''; if (!v) return; askAndLog(v, D.askKey(v)); };

  function applyBrand() {
    var b = BRANDS[app.brand] || BRANDS.burgundy, st = document.documentElement.style;
    document.documentElement.dataset.theme = app.theme === 'dark' ? 'dark' : 'light';
    st.setProperty('--header-bg', b[0]);          // the header carries the firm colour in both themes
    if (app.theme === 'dark') { st.removeProperty('--brand'); st.removeProperty('--brand-soft'); }
    else { st.setProperty('--brand', b[0]); st.setProperty('--brand-soft', b[1]); }
    document.body.classList.toggle('hdr-hidden', app.hdr === 'hidden');
  }

  /* ------------------------------------------------------------ run */
  var lastView = null;
  function render() {
    applyBrand();
    var root = $('root');
    if (app.view !== 'splash' && app.view !== 'login' && app.view !== 'keyreview' && !app.deal) app.view = 'nodeal';
    if (app.view === 'portfolio' && !can('view_portfolio')) app.view = 'home';
    var allowed = D.allowedViews(app.role);
    if (allowed && app.view !== 'splash' && app.view !== 'login' && allowed.indexOf(app.view) < 0) app.view = allowed[0];
    root.innerHTML = (VIEW[app.view] || VIEW['home'])();
    if (app.anchor && $(app.anchor)) { $(app.anchor).scrollIntoView({ block: 'center' }); }
    else if (lastView !== app.view) window.scrollTo(0, 0);
    app.visited = app.visited || {}; app.visited[app.view] = true;
    document.body.classList.toggle('has-modal', !!app.modal);
    document.body.classList.toggle('has-side', app.view !== 'splash' && app.view !== 'login');
    document.body.classList.toggle('side-rail', app.side === 'rail');
    if (app.modal) { var mf = document.querySelector('.modal input,.modal textarea,.modal select'); if (mf) mf.focus(); }
    app.anchor = null; lastView = app.view;
  }
  // E15-1: a run or save button shows it is working (label, spinner, aria-busy) and cannot be clicked twice; the action
  // runs a moment later so the change is seen, and the result it produced is highlighted once.
  var FRESH = { 'run-project': 'project', 'run-intel': 'intel', 'run-check': 'kmp', 'save-project': 'project', 'vault-upload': 'vault' };
  function fr(k) { return app.fresh === k ? ' fresh' : ''; }
  function run(el) {
    var fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.dataset.busy && !el.dataset.going) {
      el.dataset.going = '1'; el.disabled = true; el.setAttribute('aria-busy', 'true'); el.classList.add('busy'); el.textContent = el.dataset.busy;
      setTimeout(function () { app.fresh = FRESH[el.dataset.act] || null; perform(el, fn); }, 600);
      return;
    }
    perform(el, fn);
  }
  function perform(el, fn) {
    app.flash = '';
    // E15-5: actions are recorded under the person, with their role: "S. Iyer (BRLM reviewer)".
    if (S()) S().actor = person().name + ' (' + D.ROLE_LABEL[app.role] + ')';
    if (app.modal && app.modal.kind === 'counsel' && $('md_sub')) { app.modal.subject = $('md_sub').value; app.modal.body = $('md_body').value; }
    fn(el);
    save(); render();
    app.fresh = null;   // highlighted on this render only
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var tag = el.tagName;
    if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    run(el);
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.tagName === 'SELECT' && el.dataset.phFor) applyPh(el);    // no re-render, so nothing typed is lost
    if ((el.tagName === 'SELECT' || el.type === 'checkbox') && el.dataset.act) run(el);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === '?' && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) { app.help = !app.help; render(); return; }
    if (e.key !== 'Escape') return;
    if (app.help) { app.help = false; render(); var h = $('main'); if (h) h.focus(); return; }
    if (app.modal) { app.modal = null; render(); var m = $('main'); if (m) m.focus(); }
    else if (app.ask) { app.ask = false; save(); render(); var m2 = $('main'); if (m2) m2.focus(); }
  });
  document.addEventListener('fullscreenchange', function () { render(); });
  document.addEventListener('webkitfullscreenchange', function () { render(); });
  initView();
  load();
  render();
})();
</script>
</body>
</html>
